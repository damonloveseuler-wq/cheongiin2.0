<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Korean Keyboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="keyboard-container">
        <!-- Text Screen Box -->
        <textarea id="output" readonly placeholder="키보드를 입력하세요..."></textarea>

        <!-- Custom Grid Layout -->
        <div class="keyboard">
            <!-- Row 1: Numbers -->
            <div class="key num">1</div><div class="key num">2</div><div class="key num">3</div><div class="key num">4</div><div class="key num">5</div>
            <div class="key num">6</div><div class="key num">7</div><div class="key num">8</div><div class="key num">9</div><div class="key num">0</div>

            <!-- Row 2 -->
            <div class="key r2-3" data-key="ㅅ">ㅅ</div>
            <div class="key r2-3" data-key="ㅇ">ㅇ</div>
            <div class="key r2-3" data-key="ㄴ">ㄴ</div>
            <div class="key r2-3 action-key" data-action="backspace">⌫</div>

            <!-- Row 3 -->
            <div class="key r2-3" data-key="ㄱ">ㄱ</div>
            <div class="key r2-3" data-key="ㅡ">ㅡ</div>
            <div class="key r2-3" data-key="ㅣ">ㅣ</div>
            <div class="key r3-d" data-key="ㄷ">ㄷ</div>
            <div class="key r3-enter action-key" data-action="enter">↵</div>

            <!-- Row 4 -->
            <div class="key r4" data-key="ㅂ">ㅂ</div>
            <div class="key r4" data-key="ㄹ">ㄹ</div>
            <div class="key r4" data-key="ㅁ">ㅁ</div>
            <div class="key r4" data-key="ㅈ">ㅈ</div>

            <!-- Rows 5-6 Layout Mixed -->
            <div class="key emoji-key">이<br>모<br>지</div>
            <div class="key r5-mid">.</div>
            <div class="key r5-mid" data-key="ㅊ">ㅊ</div>
            <div class="key r5-mid" data-key="ㅎ">ㅎ</div>
            <div class="key r5-mid">?</div>
            <div class="key hangul-eng-key" data-action="lang">한<br>/<br>영</div>

            <div class="key r6-text">특수문자</div>
            <div class="key r6-space action-key" data-action="space">␣</div>
            <div class="key r6-text">한자</div>
        </div>
    </div>

    <!-- Reliable Korean Character Assembler Library -->
    <script src="https://jsdelivr.net"></script>
    <script src="app.js"></script>
</body>
</html>
